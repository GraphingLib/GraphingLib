name: CI - Unit Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.29"
          python-version: "3.12"
          enable-cache: true

      - name: Ruff lint
        run: uvx --from ruff==0.15.0 ruff check .

      - name: Ruff format check
        run: uvx --from ruff==0.15.0 ruff format --check .

  typecheck:
    name: Type check (package)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.29"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (incl. dev group for ty)
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked --all-extras
          else
            uv sync --all-extras
          fi

      - name: ty type check (tests excluded via pyproject)
        run: |
          # Shipping package: fail on any diagnostic, warnings included.
          uv run ty check graphinglib/
          # Examples & docs too: fail on errors, but tolerate the intentional
          # MultiFigure deprecation warnings (which become errors at its removal).
          uv run ty check --exit-zero-on-warning

  tests:
    name: Unit tests - Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.mplconfig

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.29"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install runtime dependencies only
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked --no-dev --all-extras
          else
            uv sync --no-dev --all-extras
          fi

      - name: Prepare Matplotlib cache dir
        run: mkdir -p "$MPLCONFIGDIR"

      - name: Run unit tests
        run: uv run python -m unittest discover -s unit_testing -p "*_test.py" -v

  minimum-matplotlib:
    name: Unit tests - Minimum Matplotlib
    needs: lint
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.mplconfig
      # 3.7.3 is the oldest supported release with a Python 3.12 Linux wheel.
      MATPLOTLIB_VERSION: "3.7.3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.29"
          python-version: "3.12"
          enable-cache: true

      - name: Install runtime dependencies with minimum Matplotlib
        run: |
          uv venv --python 3.12
          # Matplotlib 3.7 wheels require the NumPy 1.x ABI.
          uv pip install --only-binary matplotlib -e '.[astro,pdf]' "matplotlib==${MATPLOTLIB_VERSION}" 'numpy<2'

      - name: Run unit tests
        run: |
          mkdir -p "$MPLCONFIGDIR"
          .venv/bin/python - <<'PY'
          import os
          import matplotlib

          version = matplotlib.__version__
          print(f"Matplotlib {version}")
          if version != os.environ["MATPLOTLIB_VERSION"]:
              raise SystemExit("Unexpected Matplotlib version")
          PY
          .venv/bin/python -m unittest discover -s unit_testing -p "*_test.py" -v
